  stage4_done: "2026-11-20 (решения Егора: «боссов тоже в сюжеты», достижения и журнал боёв СОХРАНЯЮТСЯ при сбросе прогресса, «что выше написал — нормально для начала»). map_story.js НОВЫЙ (219) и map_hall.js НОВЫЙ (214). Сюжет: карточка-событие при каждом прибытии на нечищеный остров / гнездо босса (имя → история: один остров — одна история; Скрытая лагуна — своя), кнопки «В БОЙ / Отойти» (отойти — без боя и без добычи, остров ждёт); сундук — сценка: тряска 1,1–1,6 с → вскрытие → лут → «Забрать» (лут выдаёт map_mode.js как раньше, тост перехватывается на время сценки — правила выплаты не задвоены). «День N» растёт на остров/сундук/гнездо, хранится в сейве похода (map_gen.js: day, старые сейвы — день 1). Журнал+медали в ОТДЕЛЬНОМ сейве cpt-hall-v1: «Новый поход» и mapForget их не стирают — 9 медалей с прогрессом (Первый триумф, Картеограф, Гроза архипелага, Змей повержен, Левиафан усмирён, Казначей, Коллекционер, Морской волк, Ловец удачи), лента 40 записей, кнопка «Журнал» в топбаре карты, вкладки Достижения/Журнал, счётчик Побед/Отступлений/Сундуков. Хуки: mapArrive/mapToast переприсвоены в map_story.js (приём bossOver из map_boss.js); +1 строка в map_battle.js (win/loss), map_boss.js (mapBossClaim), leviathan_boss.js (leviOver) через window.mapHall; тост медали ждёт своей очереди (2,9 с) и не глушит тост трофея. index.html: теги 17–18 (map_story, map_hall) В КОНЕЦ, порядок прежних не тронут. style.css и map_mode.js (449/450) НЕ тронуты. Проверено в чёрном окне: карточка острова (текст 228 зн., день 2, кнопки), «Отойти» → без боя + рупор, «В БОЙ» → бой, победа → журнал «зачищен! +47…» + медаль «Первый триумф», трофей в статусе; сундук: тряска → «Сундук открыт: карточка «Ремонт»» → «Забрать» → журнал (день 3), stats.chests=1, трюм; гнездо Кракена: карточка 226 зн., «В БОЙ» при 1/3 островов → «Гнездо не пускает: зачищено островов 1 из 3»; Падь Левиафана: полный бой 5-4-3-3-2 → победа +241 (в коридоре 200–260), «Цунами» в трюме, done, журнал, медали Змей/Левиафан/Гроза разом; mapBossClaim → журнал «Кракен повержен: +126» (полный бой Кракена не повторялся — двигатель проверен 19-го, проверена новая строка); сброс похода: карта обнулена (gold 0, done 0, день 1), hall жив (3 записи + медаль); reload: журнал/медали целы; панель: вкладки рендерят, закрытие; шторм: без сюжета, день не растёт; регресс: классика из меню (расстановка, выбор, выстрел, победа не наступает при живом флоте), консоль чиста. Найдено и исправлено при проверке: $ принимает голый id (в новых файлах было '#id' — ошибка молча глоталась try/catch художника, кадр «пропускается»); mapHall сохранял журнал только при открытии медали — записи терялись при reload (теперь hallSave всегда); hallOpen не снимал hidden — панель рендерилась в тёмную. Тестовые сейвы (cpt-map-v1, cpt-hall-v1) стёрты — Егор начинает с чистого. НЕ проверено: тост медали во время ОТКРЫТОЙ сцены сундука (записывается в журнал, но тост за оверлеем не виден); «Отойти» у гнезда при уже выполненном гейте; сундуки gold/repair (код тот же путь, что card — карточный проверен)"

