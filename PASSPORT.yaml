school_hints_done: "2026-11-20. Аудит (по просьбе Егора) нашёл три хвоста: версии разъехались (README v3.x против index.html 2.1), код дуэли 900 комбинаций (10 слов × 90 чисел — угадываемо), подсказок и обучения нет. Исправлено: 1) КОД ДУЭЛИ — слово + 4 цифры (10 × 9000 = 90 000 комбинаций, пример ШТОРМ-1234, плейсхолдер и README обновлены); 2) ВЕРСИИ — index.html version '2.2', README-история переписана честно (v2.2 школа/подсказки → v2.1 дуэль+поход → v2.0 каркас); 3) ПОДСКАЗКИ — game_hints.js НОВЫЙ (79): CPT.hint(id,текст), одноразовость в cpt-hints-v1, очередь ≤3, плашка снизу с кнопкой «Понятно», авто-скрытие 9 с, стили инжектятся (R9), вызовы все под if (CPT.hint) — файл можно выкинуть без поломки игры; 4) ШКОЛА — school_mode.js НОВЫЙ (219): режим ШКОЛА ЮНГИ в меню, 3 урока по шагам (бой: расстановка/карточки/выстрел/правило хода/острова; поход: порт-лавка/кости/острова/сундуки/боссы/журнал; дуэль: устройства/интернет/создать+код/войти/секретность/обрыв), диплом и запись в cpt-hall-v1 через CPT.hall.event (один раз), сейв cpt-school-v1, приглашение новичка — подсказка s-invite через 1,5 с. index.html: +2 тега (game_hints.js сразу после game_core.js, school_mode.js последним), версия 2.2. Хуки: game_battle.js +4 строки (b-place на расстановке, b-fire в beginBattleC), game_cards.js +2 (b-cards при выборе), map_mode.js +2 (m-map в startMapMode), net_link.js +1 строка текста в лобби (интернет — всегда виден, не одноразовый). Проверено в чёрном окне (см. ниже). НЕ проверено на живых глазах Егора: читабельность текстов урока на телефоне"

