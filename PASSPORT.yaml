netfix_v221: "ЖИВАЯ ПРОВЕРКА: интернет на ноутбуке есть, лобби дуэли всё равно показывает «Нет связи с сетевой рубкой» — значит, падает import библиотеки, а не сеть. Диагностика в песочнице: пакет @trystero-p2p/mqtt@0.27.0 существует (esm.run → 200, имя в коде верное), но бандл jsdelivr тянет ещё 2 модуля (core и mqtt) с того же origin — 3+ запроса к cdn.jsdelivr.net, а jsdelivr известен блокировками на уровне провайдеров РФ; esm.run был единственным адресом без запасных. Заодно проверено ядро: identity:'none' — валидное значение (принимаются 'local'/'none'/loader/UserIdentity), код дуэли прав не требует. ФИКС: net_link.js netLoadLib перебирает 4 зеркала по очереди (esm.sh → fastly.jsdelivr.net → esm.run → gcore.jsdelivr.net), первое живое кэшируется в netMod; хук стенда window.CPT_NET_SRC сохранён первым; все 4 зеркала проверены curl-ом (200), цепочка модулей грузится с одного origin — fallback целостен. Текст ошибки для игрока не менялся. index.html version '2.2.1', README +раздел v2.2.1, net_link.js 293 строки (node --check OK). ПРОВЕРЕНО в песочнице: curl всех 4 зеркал (200) + ЖИВОЙ ПРОГОН в безголовом браузере (file:// → лобби → «СОЗДАТЬ БОЙ» → код ЯКОРЬ-4215, красной строки нет, значимых ошибок страницы нет — scripts/test-net-fix.js). НЕ проверено: живой клик Егора — если красная строка останется, взять F12 → Console и прислать скриншот. ИТОГ ВЕЧЕРА: Егор прислал скриншот с ноутбука — код КРАБ-9909, зелёный статус «Ждём друга...», красной строки нет — фикс подтверждён на реальном устройстве. Осталось: дуэль двух живых устройств (брокеры emqx/hivemq/mosquitto проверить при реальной дуэли) и заливка пакета 35 файлов на GitHub"
