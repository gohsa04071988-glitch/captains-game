  stage1_5_done: "2026-11-18 по запросу Егора: ПОЛНАЯ карта (колода 21 куска — пустых нет), корабль крупнее (1.55) и качка сильнее (bob 2.6 / rock 0.09), КОСТИ: кубики стрекочут 0.95 с, сумма 2–12, вихрь швыряет корабль в неожиданное место (море или узел), ускорение x2.6 + тряска + брызги; сейв морских/штормовых/мельных прибытий. По второму запросу Егора: карта НА ВСЁ ОКНО (1600×900 → канва 1260×728, 79% ширины; было 600px из-за max-width в style.css — перекрыто скриптом), resize подхватывается, кости — крупная кнопка в правом нижнем углу карты, «Новый поход» крупнее; проверки: клик по кнопке UI, два броска, resize 1600→1280 (1260×728→1087×628), классика цела, консоль чиста"
  bugs_fixed: "mapArrive читал уже обнулённый goal (тихая ошибка в try/catch художника); mapLoad не задавал курс корабля — NaN; страховка от битого сейва; 2026-11-18: если при ручной сборке потерялся map_battle.js — прибытие на остров теперь НЕ молчит, рупор говорит «Бой не открылся: потерялся map_battle.js» (проверено: натуральный клик по острову открывает бой, 446 строк)"
  stage2_done: "2026-11-18: бои на островах работают (map_battle.js, +opts в startClassic, уровни бота в game_bot.js). Проверено в чёрном окне: бой с «Тихой гавани» 8×8 lvl2 (бейдж, трюм→колода, полный круг боя, ответ бота), бой со «Скалистого клыка» 10×10 lvl3 (трюмные Радар/Щит/Залп предвыбраны и потрачены — трюм пуст), победа → «🧭 В поход» → +36 монет и галочка (сейв пережил перезагрузку и даже перезапуск браузера), поражение → отступили без галочки; регресс: классика (fromMap=false, «Заново», бейдж-акватория) и кости целы, консоль чиста"
  stage3_block1_done: "2026-11-19 (решения Егора: гейт после 3 островов; за остров — часть ключа ИЛИ обрывок карты; босс даёт уникальную одноразовую карточку; магазин и частоту встреч взял на себя). map_boss.js НОВЫЙ. Проверено в чёрном окне: дефолты parts на новом походе и старом сейве (gold сохраняется); гейт 0/3 → «островов 0 из 3», 3 острова без карты → «обрывков 0 из 3»; полный гейт → экран босса, KR.on, бой жив; bossOver(true) → гнездо done, +157 монет, «Гнев Кракена» в трюме, кнопка «🧭 В поход», возврат на карту с рупором, классические слушатели восстановлены («Заново»); ключ 3/3 → лагуна вставлена детерминированно (608,414 — вне зоны кнопки), переживает reload, бой 10×10 с бейджем «Скрытая лагуна» → +200 монет и 2 карточки, done; карта «Гнев Кракена»: кнопка в панели боя, тратится, ровно 3 отметки eShot, ход боту; классический Кракен изолирован (KR.on=false — золото/трюм не тронуты); разорённое гнездо → «Кракен уже повержен»; Левиафан → честная заглушка «блок 1b»; кости целы; консоль чиста. Попутно исправлен сдвиг тел островов (drawIsleC использует PAD для обеих осей — тела рисовались в y=n.x−28, у лагуны уходили за канву)"
  stage3_rest: "блоки 2 и 3 ВЫПОЛНЕНЫ 2026-11-20 — см. stage5_done (тиры сундуков, лавка в порту, события моря, блуждающий корсар)"
  stage3_block1_fix: "2026-11-19: найден фарм-баг — mapSave писал done только для островов, гнёзда не сохранялись: после победы над Кракеном гнездо снова пускало и трофей с карточкой давались заново. Исправлено (острова И боссы в done, map_gen.js); проверено: и в памяти, и после перезагрузки страницы гнездо «разорено», трофей не дублируется, старые сейвы целы"
  stage3_block1b_done: "2026-11-19 (решение Егора: «хорошо, пробуем» — гейт 5 островов + Кракен, эскадра 5-4-3-3-2, накат волны, трофей 200–260 + карточка; playerFleet добавил при проверке — очередь игрока была 5-4-3-3-2). leviathan_boss.js НОВЫЙ, бой на движке классики. Проверено в чёрном окне: гейт 0/5 → «островов 0 из 5», 5 островов без Кракена → «сначала повергни Кракена»; полный гейт → бой 10×10, бейдж «Падь Левиафана», intro, eShips 5-4-3-3-2, очередь игрока 4-3-2-2, overFn=leviOver; РАССТАНОВКА 200/200 (пятая палуба встаёт всегда); волна: 3 хода бота → 1+1+2 отметки, две в одном ряду, «Волна отхлынула. Ваш ход»; победа → кнопка «🧭 В поход» (метка исправлена: overFn давал «Заново») → +231 монета, «Цунами» в трюме, done, рупор + статус; reload → «Левиафан уже повержен», монеты/карточка целы; «Цунами» в островном бою: приходит из трюма, не выбирается до боя (панель 6 без боссовских), бьёт ровно 4 клетки ОДНОГО ряда, тратится, ход боту; поражение → отступили, педь ждёт, золото цело; регресс: остров (28 монет + часть ключа, эхо в статусе), классика easy из меню, обычный ход бота (1 отметка, без волны), CARD_DEFS Кракена не задет; консоль чиста. Трофей не гаснет: дублируется в статус-строку — на островах и у обоих боссов"
  stage5_done: "2026-11-20 (решение Егора: «все по очереди» — блок 2, блок 3, README, пакет; плюс значок-«шильдик» вместо серой иконки браузера на телефоне). ЗНАЧОК: сгенерирована иконка (весёлый череп в бандане + якорь + золото на синем — в палитре игры), нарезаны favicon.ico (16/32/48), favicon-192, favicon-512, apple-touch-icon 180 (углы заполнены полем значка — iOS сам скругляет), site.webmanifest; 4 ссылки в head index.html (порядок тегов скриптов не тронут). БЛОК 2: тиры сундуков — map_gen назначает tier ДОПОЛНИТЕЛЬНЫМИ бросками ГПСЧ после раскладки колоды (прежние броски не сдвинуты: позиции узлов и старые сейвы целы — проверено подменой сейва, opened/done легли на те же координаты), 50/35/15%; сценка map_story красит крышку/коробку/замок, заголовки «Медный/Серебряный/Золотой сундук»; база выплачивает map_mode как раньше, тир добавляет бонус: серебро +25–45 монет, золото +70–110 и карточку, если база не карточка; при потере map_story выплаты не падают (база в map_mode). ЛАВКА map_shop.js (122, НОВЫЙ): открытие на каждое прибытие в порт (хук mapArrive поверх map_story), 6 карточек 55–85 монет, названия из CLASSIC_CARDS, дубликаты разрешены, дизейбл при нехватке золота, купленное в трюм+сейв. БЛОК 3: map_sea.js (99, НОВЫЙ) — ~20% на переход, срабатывание на 55% пути, 7 событий (флейвор, монеты 8–25, обрывок с капом 3/3, ремонт), на костях и коротких перегонах молчит, один раз на переход. map_rogue.js (243, НОВЫЙ) — с 3-го дня блуждающий корсар (медленней игрока, бродит по узлам, виден всегда, метка «КОРСАР»), перехват <46px при открытых панелях и костях отложен, карточка «В БОЙ/Отойти», бой 8×8 бот lvl3 на движке классики (over-крючок БЕЗ fromMap — кнопка «🧭 В поход» от overFn), победа 45–90 + 40% карточка, cool=3 дня, поражение — cool=1; позиция/cool в сейве (map_gen: sea), старые сейвы — корсар появится сам. index.html: теги 19–21 в конец (всего 21), head +4 строки. Проверено в чёрном окне: старый сейв без sea/day — отметки и тиры на местах; сцены меди/серебр