net_duel_done: "2026-11-20 вечер. Егор попросил игру против друга на разных устройствах (хотсит отверг сразу). Сделано 3 файла по R11 (+3 тега в index.html, версия v2.1). Стек: Trystero 0.27 (@trystero-p2p/mqtt — WebRTC P2P, сигналинг через 4 публичных брокера: emqx/hivemq/shiftr/mosquitto; все проверены CONNACK'ом из песочницы пробником scripts/probe-brokers.mjs); библиотека подгружается динамическим import только при открытии лобби — офлайн-режимы не задеты. Флоты приватны: защита разрешает выстрел на своей доске и шлёт результат (в консоли противника флот не лежит). Острова/карта/жребий — от хозяина (hello). ПРОВЕРЕНО В ЧЁРНОМ ОКНЕ (стенд scripts/duel-harness.html — два iframe; мок scripts/mock-net.js на BroadcastChannel для механики + РЕАЛЬНЫЙ брокер emqx для связи — соединение 2,4 с, реальный выстрел прошёл): выстрелы/попадание/потопление/обломки на доске стрелявшего; радар (золотой глаз); щит (принял выстрел и рассыпался); ремонт без пробоин (карточка остаётся, ход не съеден); дым (следующий выстрел стреляющего — наугад); залп (3 выстрела, очередь у стрелка, защита видит «ЗАЛП противника»); торпеда (разбилась об остров И потопила линкор с обломком); победа и поражение обеими сторонами; реванш ×2 (новая карта/острова); обрыв связи посреди боя → «СОЕДИНЕНИЕ ПОТЕРЯНО»; «Заново» при отвале друга → подсказка. Регресс: классика 10×10 (расстановка, 3 карточки, выстрел, ответ бота), 5 кнопок в меню, консоль чиста в обоих окнах. Лимиты: 274/398/312 ≤ 450. Найдено и исправлено при проверке: 1) shotRes.lost никогда не ставился — победитель не узнавал о победе (зависал в ожидании); 2) получатель карточек щит/ремонт/дым/радар не забирал ход — оба окна висели в duel-them; 3) залп: защита забирала ход после первого выстрела и молча глотала остальные → выстрел теперь несёт end/left; 4) таймаут ответа не снимал фазу — бой замерзал → теперь duelOver(null); 5) identity:'none' — без него два клиента одного браузера считались одним игроком (важно и для теста, и для «два окна у бабушки»). НЕ проверено на реальных устройствах: два разных браузера/сети, мобильный интернет РФ, пинг дальних регионов — Егор проверит с другом после заливки"

