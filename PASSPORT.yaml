# ============================================================================
#  ПАСПОРТ ПРОЕКТА «КАПИТАНЫ ОСТРОВОВ» · v3.6 · 2026-11-20
#  Формат: YAML (DSL). Рабочий документ Егора и ассистента.
#  README.md — для игроков; здесь — правила, структура и план для работы.
# ============================================================================

project:
  name: "Капитаны Островов"
  genre: "морской бой с островами, карточками и боссом-Кракеном"
  stack:
    language: "vanilla JavaScript (ES6), Canvas 2D — без фреймворков и зависимостей"
    markup: "HTML + CSS, без сборки и сборщиков"
    build: "файлы собираются вручную (Блокнот); игра открывается через index.html"
  roles:
    owner: "Егор — собирает файлы сам; правки до ~2 строк вносит сам"
    assistant: "правит файлы в песочнице; всё проверяет сам в «чёрном окне», Егора не дёргает"

# ----------------------------------------------------------------------------
# ПРАВИЛА РАБОТЫ (свод паспорта v2.1 + уроки сессии)
# ----------------------------------------------------------------------------
rules:
  R1_limits: "файл <= 450 строк — комфорт; > 1000 — красная черта; при подходе к лимиту дробить до 450"
  R2_meaning: "дробить по смыслу (один файл = одна часть игры), а не по счётчику строк"
  R3_no_sheets: "в чат целым текстом — только файлы <= 450 строк; простыни не выдавать никогда"
  R4_edit_protocol: "правка ~2 строки — фрагмент в чат, Егор правит сам; правка 20+ строк — ассистент правит файл сам"
  R5_paint_sync: "вся отрисовка синхронно в общем кадре rAF (CPT.painter); параллельных циклов рисования нет"
  R6_no_copy_paste: "общее (утилиты, звуки, палитры) живёт в game_core.js; дублей нет"
  R7_decouple: "модули общаются через общий объект CPT и общее состояние; в чужие internals напрямую не лезем"
  R8_selfcheck: "ассистент проверяет сам: node --check, wc -l, http.server + agent-browser, скриншоты — молча, без вопросов Егору"
  R9_css_frozen: "style.css заморожен (решение Егора) — не трогаем; лимит строк на него не распространяется"
  R10_js_txt_trap: "при передаче файлов напоминать: «Сохранить как» → тип «Все файлы» → точное имя с .js → кодировка UTF-8"
  R11_mode_plug: "новый режим = новый файл через CPT.mode() + одна строка в index.html; старые механики не переписываем"

# ----------------------------------------------------------------------------
# СТРУКТУРА (34 файла в папке: 27 в списке files + паспорт + 6 файлов значка; wc -l 2026-11-20)
