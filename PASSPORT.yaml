# РЕМОНТ + ЗВУК ПОЛЁТА v2.2.4 (2026-11-22: «после лечения бой не кончается»)
# ----------------------------------------------------------------------------
healfix_v224: "Егор нашёл баг живой дуэли: после карточки «Ремонт» в заделанную клетку второй раз попасть НЕЛЬЗЯ, а в конце боя корабль «как бы убит и как бы леченный» — бой невозможно закончить. Причина: ремонт делал pShot=0 и hits-- только у лечащего; у друга метка попадания eShot=2 оставалась навсегда — выстрел в клетку блокировался, недобитый корабль никогда не тонул, allSunk не наступал. Классика не страдала (бот перечитывает pShot — game_bot.js). ФИКС: ремонт шлёт другу координату заделанной пробоины — card{key:'repair',r,c} (net_cards.js) + ПОДСТРАХОВКА от потери пакета: D.healNext уезжает со СЛЕДУЮЩИМ shotRes/torpRes (res.healed) через уже существующий переспрос nudge (net_duel.js duelIncomingShot/duelIncomingTorp); получатель (duelIncomingCard / duelFire / duelFireTorp) стирает свою метку eShot=0 и рисует зелёный fx «repair» на доске друга; res.healed применяется ДО отметки нового выстрела (случай «друг бьёт как раз в заживлённую клетку»). Приватность: координата известна другу и так (это его попадание); раскрывается только «попадание отменено». Заодно ЗВУК ПОЛЁТА (просьба Егора): shellWhistleC(dur, dist) в game_fx.js — свист летящего ядра, длительность = времени полёта (0.6–1.1 с), стартовая высота 1060−54·dist (в упор тонкий короткий, через всё море — долгий низкий, падение тона к 230 Гц к месту падения, громкость 0.034 под грохот выстрела); вызов из shellPushC (game_battle.js) — работает во ВСЕХ режимах сразу: классика, бот, гнев Кракена, цунами, дуэль (обе стороны). Версия 2.2.4 (cpt_core.js). ПРОВЕРЕНО: node --check всех 4 js; лимиты R10 448/330/355/408 ≤ 450; полный дуэльный бой на мок-сети (scripts/test-healfix.js, два iframe + BroadcastChannel, поле 8×8): соединение, попадание, ремонт → у друга eShot=0 (ключевая проверка), повторный выстрел в заживлённую клетку = снова попадание (на старом коде — тихий отказ), healNext уехал с shotRes и очистился, корабль добит, ВСЕ корабли топятся, финал «ПОБЕДА»/«ПОРАЖЕНИЕ» в обоих окнах — бой ЗАКАНЧИВАЕТСЯ; shellWhistleC доступен в обоих окнах, ошибок страницы нет. НЕ проверено живым ухом: тембр свиста на реальных телефонах — Егор послушает в дуэли"

