architecture:
  registry: "window.CPT: CPT.mode() — кнопка режима в меню; CPT.painter() — художник в общий кадр; CPT.lore() — справка в меню"
  frame: "один requestAnimationFrame в game_core.js по очереди вызывает всех painters"
  state: "классика — общее C-состояние (game_core.js); ходы передаются через handOverToFoeC"
  shell: "результат выстрела считается сразу, визуал отложен на dur полёта (620 + 48*дистанция, максимум 1150 мс)"
  selfcheck: "window 'load' → crew-список «файл → функции»; если файл потерян — красная плашка .crew-warn в меню называет его; BossRender проверяется отдельно (typeof window.BossRender)"

