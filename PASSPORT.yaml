netfix_v223: "Егор сыграл дуэль на телефонах с другом: «со скрипом — то пишет ошибку, то запустил в комнату, но тормозил». Диагноз по коду: 1) ГОНКА ЗАЛПА — получатель после shotRes спит HOLD_BOT 1500 мс в фазе duel-fire; на быстрой связи второй/третий выстрел залпа прилетал раньше и молча выбрасывался (duelIncomingShot требует duel-them) → стреляющий висел 15 с → «СОЕДИНЕНИЕ ПОТЕРЯНО»; 2) таймаут 15 с жесток для мобильного интернета; 3) потерянные пакеты не переспрашивались; 4) без TURN два телефона в LTE (CGNAT) соединяются «через раз»; 5) тормоза: обе доски перерисовывались целиком 60 раз в секунду (градиент/сетка/надписи/пальмы заново каждый кадр) + touch-action:manipulation пропускал pan/zoom — тапы по клеткам иногда «пропадали». ФИКСЫ: почтовый ящик D.inbox + duelPump в net_duel.js; duelWait 10/30+15 с с переспросом nudge и отдачей D.lastRes (shotRes/torpRes/radarRes сохраняются у отвечающего, максимум 3 переспроса); TURN OpenRelay в rtcConfig (net_link.js, поддержка подтверждена по исходнику ядра Trystero 0.27 — iceServers пользователя мерджатся по /^turns?:/i); hello с повторами 5×2,5 с; мягкий текст ожидания входа; СТАТИЧНЫЙ СЛОЙ ДОСКИ в game_draw.js (офскрин-кэш воды/сетки/надписей/островов с учётом dpr, метки теперь поверх песка); touch-action:none на обеих досках скриптом (R9 цел); губернатор кадра в cpt_core.js (кадр дороже 13 мс две секунды → 30 fps, легче 6 мс 14 с → обратно 60). ПРОВЕРЕНО В ПЕСОЧНИЦЕ: node --check всех js, лимиты (450/424/323/313/129), setInterval 0; полный дуэльный бой на мок-сети scripts/test-duel-v223.js (два iframe, BroadcastChannel = мгновенная доставка — ровно условия гонки): соединение обоих, залп 3 выстрела дошли и ход перешёл (на старом коде выстрелы 2–3 терялись), ложных «СОЕДИНЕНИЕ ПОТЕРЯНО» нет, потеря пакета (shotRes проглочен подменой CPT.net.send) → через 30 с переспрос → бой продолжился; регресс классики 10×10 (расстановка, 3 карточки, выстрел, ответ бота), статичный слой C._bgP/_bgE создан (1008px при dpr 2 — dpr учтён), touch-action:none применён, консоль чиста в обоих окнах; реальный брокер (test-net-fix.js): код появился, rtcConfig принят библиотекой, ошибок нет; телефонный вьюпорт 390×844 dpr 2: лобби и бой отрисованы, острова/сетка/надписи на месте, выстрел и метка «мимо» легли правильно (shot-phone-v223.js, скриншоты p223-*.png). НАЙДЕНО И ИСПРАВЛЕНО при проверке: первый вариант губернатора сам ставил rAF после вызова orig — цепочка кадров удваивалась экспоненциально и ВЕШАЛА оба окна (выловлен пошаговым пробником probe-duel-step.js; исправлено: после вызова orig кадр ставит только сам orig, мы ставим лишь когда orig пропущен). НЕ проверено: живая дуэль двух телефонов Егора (спасает ли TURN реальное LTE-соединение — увидит только живой бой; если «через раз» останется — скрин F12 → Console), реальная экономия FPS на слабом телефоне (губернатор включается сам по факту), поведение переспроса на совсем медленной сети (таймеры честные, но живой пинг не измерялся)"

