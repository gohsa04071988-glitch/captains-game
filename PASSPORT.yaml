# ============================================================================
#  ПАСПОРТ ПРОЕКТА «КАПИТАНЫ ОСТРОВОВ» · v3.0 · 2026-11-17
#  Формат: YAML (DSL). Рабочий документ Егора и ассистента.
#  README.md — для игроков; здесь — правила, структура и план для работы.
# ============================================================================

project:
  name: "Капитаны Островов"
  genre: "морской бой с островами, карточками и боссом-Кракеном"
  stack:
    language: "vanilla JavaScript (ES6), Canvas 2D — без фреймворков и зависимостей"
    markup: "HTML + CSS, без сборки и сборщиков"
    build: "файлы собираются вручную (Блокнот); игра открывается через index.html"
  roles:
    owner: "Егор — собирает файлы сам; правки до ~2 строк вносит сам"
    assistant: "правит файлы в песочнице; всё проверяет сам в «чёрном окне», Егора не дёргает"

# ----------------------------------------------------------------------------
# ПРАВИЛА РАБОТЫ (свод паспорта v2.1 + уроки сессии)
# ----------------------------------------------------------------------------
rules:
  R1_limits: "файл <= 450 строк — комфорт; > 1000 — красная черта; при подходе к лимиту дробить до 450"
  R2_meaning: "дробить по смыслу (один файл = одна часть игры), а не по счётчику строк"
  R3_no_sheets: "в чат целым текстом — только файлы <= 450 строк; простыни не выдавать никогда"
  R4_edit_protocol: "правка ~2 строки — фрагмент в чат, Егор правит сам; правка 20+ строк — ассистент правит файл сам"
  R5_paint_sync: "вся отрисовка синхронно в общем кадре rAF (CPT.painter); параллельных циклов рисования нет"
  R6_no_copy_paste: "общее (утилиты, звуки, палитры) живёт в game_core.js; дублей нет"
  R7_decouple: "модули общаются через общий объект CPT и общее состояние; в чужие internals напрямую не лезем"
  R8_selfcheck: "ассистент проверяет сам: node --check, wc -l, http.server + agent-browser, скриншоты — молча, без вопросов Егору"
  R9_css_frozen: "style.css заморожен (решение Егора) — не трогаем; лимит строк на него не распространяется"
  R10_js_txt_trap: "при передаче файлов напоминать: «Сохранить как» → тип «Все файлы» → точное имя с .js → кодировка UTF-8"
  R11_mode_plug: "новый режим = новый файл через CPT.mode() + одна строка в index.html; старые механики не переписываем"

# ----------------------------------------------------------------------------
# СТРУКТУРА (12 файлов; размеры проверены wc -l 2026-11-17)
# ----------------------------------------------------------------------------
structure:
  script_order:                 # порядок тегов <script> внизу index.html — НЕ менять
    - game_core.js
    - game_cards.js
    - game_battle.js
    - game_bot.js
    - game_draw.js
    - game_fx.js
    - kraken_boss.js
    - kraken_attacks.js
    - kraken_body.js
    - kraken_render.js
  files:
    index.html:        { lines: 209, role: "каркас: меню, экраны, реестр CPT, 10 тегов скриптов внизу" }
    style.css:         { lines: 491, role: "тема, доски, карточки — ЗАМОРОЖЕН (R9)" }
    game_core.js:      { lines: 448, role: "реестр CPT, режимы ПРОСТОЙ/СЛОЖНЫЙ БОЙ, C-состояние, утилиты (inB/rnd/sleep/sayG), звуки (toneC/hornC/pingC/thumpC/splashC/boomShotC), палитры карт (Тропики/Лагуна/Скалы), самопроверка сборки" }
    game_cards.js:     { lines: 327, role: "6 карточек (Щит/Торпеда/Радар/Ремонт/Дым/Залп): панель, выбор, торпеда от любого края моря" }
    game_battle.js:    { lines: 376, role: "классический бой: расстановка, playerFire, shellPushC (полёт 0.6–1.1 с), handOverToFoeC" }
    game_bot.js:       { lines: 90,  role: "ход бота botMove (прицел от ~3 с)" }
    game_draw.js:      { lines: 393, role: "художник классики: drawClassic, спрайты кораблей" }
    game_fx.js:        { lines: 331, role: "эффекты: drawFxC (взрывы, брызги, торпеда) + drawShellC (снаряд-комета)" }
    kraken_boss.js:    { lines: 408, role: "режим КРАКЕН: CPT.mode, ход босса krakenTurn, видный заплыв glideKrakenB, показ dual showKrakenSea, скрытый переезд moveKrakenB" }
    kraken_attacks.js: { lines: 186, role: "атаки босса: krakenAttack, bossShot — в задачу заплыва НЕ вмешиваемся" }
    kraken_body.js:    { lines: 240, role: "тело Кракена: drawKraken" }
    kraken_render.js:  { lines: 305, role: "художник босс-режима: BossRender" }
    README.md:         { lines: 97,  role: "документ для игроков — УСТАРЕЛ (описывает v2.0 и 5 файлов); обновить в backlog" }

architecture:
  registry: "window.CPT: CPT.mode() — кнопка режима в меню; CPT.painter() — художник в общий кадр; CPT.lore() — справка в меню"
  frame: "один requestAnimationFrame в game_core.js по очереди вызывает всех painters"
  state: "классика — общее C-состояние (game_core.js); ходы передаются через handOverToFoeC"
  shell: "результат выстрела считается сразу, визуал отложен на dur полёта (620 + 48*дистанция, максимум 1150 мс)"
  selfcheck: "window 'load' → crew-список «файл → функции»; если файл потерян — красная плашка .crew-warn в меню называет его; BossRender проверяется отдельно (typeof window.BossRender)"

# ----------------------------------------------------------------------------
# ЧТО УЖЕ РАБОТАЕТ (проверено и одобрено)
# ----------------------------------------------------------------------------
done:
  modes:
    - "ПРОСТОЙ БОЙ: 8×8, острова, бот"
    - "СЛОЖНЫЙ БОЙ: 10×10, острова, бот"
    - "КРАКЕН: невидимая зона 3×3, всплытия, свой набор карточек"
  glide: "заплыв Кракена ВИДЕН: на время его хода обе доски (dual), море Кракена впереди — всплытие → скольжение с пеной → атака флотом впереди → ныряние → возврат вида; moveKrakenB сохранён"
  cards: "в классике выбор 3 из 6; карточки как настоящие карты: иконка, название, счётчик"
  torpedo: "всплытие → рупор-стрелки (только внутрь поля) → удар по всей линии; об остров гаснет"
  shell: "снаряд-КОМЕТА: вспышка у борта, пунктирный хвост, дым клубами, полёт 0.6–1.1 с — одобрена, НЕ менять"
  assembly_check: "плашка самопроверки называет потерянный файл (спасла нас с game_cards.js)"
  battles_launch: "запуск классических боёв починен — причина была в потерянном game_cards.js при ручной сборке"

