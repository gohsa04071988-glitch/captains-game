<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#051223">
<meta name="description" content="Морской бой с боссами: поход по карте с сундуками, дуэль с другом по коду на двух устройствах и школа юнги. Бесплатно, прямо в браузере — на телефоне и компьютере.">
<meta property="og:type" content="website">
<meta property="og:site_name" content="Капитаны Островов">
<meta property="og:title" content="Капитаны Островов — морской бой: один, с боссом или с другом">
<meta property="og:description" content="Дуэль с другом по коду на двух телефонах, поход по карте с сундуками, боссы Кракен и Левиафан. Прямо в браузере, без установки.">
<meta property="og:image" content="og-banner.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:image:alt" content="Капитаны Островов — морской бой с боссом: дуэль с другом по коду, боссы и поход по карте">
<meta property="og:locale" content="ru_RU">
<meta name="twitter:card" content="summary_large_image">
<title>Капитаны Островов — Морской бой с Боссом</title>
<link rel="stylesheet" href="fonts.css">
<link rel="stylesheet" href="style.css">
<link rel="icon" href="favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="192x192" href="favicon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="site.webmanifest">
<script src="cpt_core.js"></script>

</head>
<body>

<!-- ==================== ГЛАВНОЕ МЕНЮ ====================
     v3 «пляжная витрина»: меню — вся сцена, а не карточка.
     Облака и кораблик — общие по body (style.css), здесь только
     солнце и жители пляжа. Общесистемное золото — только у
     главной кнопки и у выбранного режима. -->
<section id="screen-menu" class="screen active">
  <div class="menu-scene" aria-hidden="true">
    <div class="ms-sun"></div>
    <div class="ms-palm">🌴</div>
    <div class="ms-crab">🦀</div>
  </div>

  <!-- судовой журнал: кнопка в углу открывает ряд исторических справок -->
  <div class="menu-corner">
    <button id="btn-journal" class="corner-btn" type="button" aria-label="Судовой журнал">📓</button>
    <span class="corner-lbl">Журнал</span>
  </div>

  <div class="logo-wrap">
    <h1 class="logo">КАПИТАНЫ<b>ОСТРОВОВ</b></h1>
    <p class="subtitle">Морской бой с Боссом</p>
  </div>

  <!-- витрину строит CPT.buildMenu(): бои 2×2, ниже пара Школа + Поход -->
  <div id="modes-list" class="modes"></div>
  <div id="duo-list" class="duo"></div>

  <div id="lore-row" class="lore-row hidden"></div>
  <div id="lore-box" class="lore-box hidden"></div>

  <div class="menu-bottom">
    <button id="btn-start" class="btn-gold cta" disabled>В БОЙ! ▶</button>

    <!-- тизер будущих релизов: нажимать нечего, просто витрина -->
    <div class="teaser">
      <span class="teaser-medal">🚢<i>🔒</i></span>
      <span class="teaser-text"><b>Скоро в релиз: живой бой с кораблями</b><small>корабли плавают и стреляют прямо на поле</small></span>
      <span class="teaser-badge">СКОРО</span>
    </div>

    <div class="menu-foot"><span id="ver-tag" class="ver-tag"></span></div>
  </div>
</section>

<!-- ==================== КЛАССИЧЕСКИЙ БОЙ ==================== -->
<section id="screen-game" class="screen">
  <div class="topbar">
    <button id="btn-quit-game" class="btn-small">← Меню</button>
    <div id="game-status" class="status">Ваш ход</div>
    <button id="btn-rotate" class="btn-small">⟳ Повернуть</button>
    <button id="btn-auto" class="btn-small gold">⚓ Авто</button>
  </div>
  <div id="place-info" class="place-info"></div>

  <!-- data-turn переключают скрипты: place | me | foe.
       me  — ход игрока: впереди доска противника,
       foe — ход противника: впереди ваша доска. -->
  <div id="boards-classic" class="boards" data-turn="place">
    <div class="board-block own">
      <h3>Ваш флот</h3>
      <canvas id="canvas-player"></canvas>
    </div>
    <div class="board-block foe">
      <h3>Флот противника</h3>
      <canvas id="canvas-enemy"></canvas>
    </div>
  </div>

  <div id="game-over" class="overlay hidden">
    <div class="overlay-card">
      <div id="go-emoji" class="overlay-emoji">🏆</div>
      <h2 id="go-title">ПОБЕДА!</h2>
      <p id="go-text"></p>
      <div class="overlay-btns">
        <button id="btn-game-again" class="btn-gold">Заново</button>
        <button id="btn-game-menu" class="btn-ghost">В меню</button>
      </div>
    </div>
  </div>
</section>

<!-- ==================== БОСС: КРАКЕН ==================== -->
<section id="screen-boss" class="screen">
  <div class="topbar">
    <button id="btn-quit-boss" class="btn-small">← Меню</button>
    <div id="boss-status" class="status">Ваш ход</div>
    <button id="btn-refleet" class="btn-small">↻ Переставить флот</button>
  </div>

  <div class="hp-row">
    <div class="hp-block">
      <span class="hp-label">Флот</span>
      <div class="hp-bar"><div id="hp-player-fill" class="hp-fill player"></div></div>
      <span id="hp-player-num" class="hp-num">11/11</span>
    </div>
    <div class="hp-block">
      <span class="hp-label">Кракен</span>
      <div class="hp-bar"><div id="hp-kraken-fill" class="hp-fill kraken"></div></div>
      <span id="hp-kraken-num" class="hp-num">9/9</span>
    </div>
  </div>

  <div id="boards-boss" class="boards" data-turn="me">
    <div class="board-block own">
      <h3>Ваш флот</h3>
      <canvas id="canvas-boss-player"></canvas>
    </div>
    <div class="board-block foe">
      <h3>Море Кракена</h3>
      <canvas id="canvas-boss-kraken"></canvas>
    </div>
  </div>

  <!-- Карточки строит kraken_boss.js из списка CARD_DEFS -->
  <div id="cards-panel" class="cards-panel"></div>

  <div id="torpedo-prompt" class="torpedo-prompt hidden">
    <span>Торпеда бьёт по всей линии. Направление:</span>
    <button id="btn-t-row" class="btn-small gold">↔ строка</button>
    <button id="btn-t-col" class="btn-small gold">↕ столбец</button>
    <button id="btn-t-cancel" class="btn-small">отмена</button>
  </div>

  <div id="boss-over" class="overlay hidden">
    <div class="overlay-card">
      <div id="bo-emoji" class="overlay-emoji">🏆</div>
      <h2 id="bo-title">ПОБЕДА!</h2>
      <p id="bo-text"></p>
      <div class="overlay-btns">
        <button id="btn-boss-again" class="btn-gold">Заново</button>
        <button id="btn-boss-menu" class="btn-ghost">В меню</button>
      </div>
    </div>
  </div>
</section>

<script src="game_core.js"></script>
<script src="game_hints.js"></script>
<script src="game_cards.js"></script>
<script src="game_battle.js"></script>
<script src="game_bot.js"></script>
<script src="game_draw.js"></script>
<script src="game_fx.js"></script>
<script src="kraken_boss.js"></script>
<script src="kraken_attacks.js"></script>
<script src="kraken_body.js"></script>
<script src="kraken_render.js"></script>
<script src="map_gen.js"></script>
<script src="map_mode.js"></script>
<script src="map_dice.js"></script>
<script src="map_battle.js"></script>
<script src="map_boss.js"></script>
<script src="leviathan_boss.js"></script>
<script src="map_story.js"></script>
<script src="map_hall.js"></script>
<script src="map_shop.js"></script>
<script src="map_sea.js"></script>
<script src="map_rogue.js"></script>
<script src="net_link.js"></script>
<script src="net_duel.js"></script>
<script src="net_cards.js"></script>
<script src="school_mode.js"></script>
<!-- площадка Telegram: обёртка сама решает, когда качать API (v2.3.2) -->
<script src="cpt_tg.js"></script>
<script src="cpt_sdk.js"></script>
</body>
</html>
